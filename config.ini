[secure]
cookie_secure = true # Options: true, false
cookie_https_only = true # Options: true, false
cookie_same_site = lax # Options: lax, strict, none
cookie_expire = 8 # hours

[web]
server_mode = http # Options: http, cgi
port = 8881
assets = app/views/assets
views_path = /app/views/template_bootstrap
admin_url = /admin

[db]
driver = mysql
name = golang
user = golang
passwd = golang
host = db
port = 3306

[logging]
output = multi # Options: stdout, file, multi
level = debug # Options: debug, info, warn, error, fatal
file = /logs/app.log # Path to log file if output is file or multi
charset = utf8mb4
max_size = 100
max_backups = 10
max_age = 30
compress = true
enable = true
rotate = true
disable_colors = false
disable_timestamp = false
disable_level = false
disable_caller = false
disable_stacktrace = false
enable_async = true
async_buffer_size = 1000
async_flush_interval = 1000
async_flush_timeout = 5000
async_flush_level = info